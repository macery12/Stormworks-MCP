name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    # Stormworks MCP is Windows only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          version: "0.11.21"
      - run: uv sync --locked
      - run: uv run ruff check .
      # Portable synthetic/rotation/motion tests always run; local catalogue/reference tests skip without assets.
      # One worker per runner CPU; worksteal keeps the few long hull and tool tests from
      # holding up the rest. The client smoke runs against the frozen EXE in windows-package.
      - run: uv run pytest -q -n auto --dist worksteal --junitxml=out/pytest.xml
      # Tool definitions are graded by TDQS (https://tdqs.dev); keep the keyless lint free of findings.
      - name: TDQS lint
        run: |
          npx -y mcp-tdqs@0.2.0 lint --command "uv run server.py" --format json --output out/tdqs.json --fail-on warning
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python -c "import json, sys; f = json.load(open('out/tdqs.json'))['findings']; print(*f, sep='\n'); sys.exit(bool(f))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-results
          path: out/pytest.xml

  # Runs alongside the tests; a tagged release still needs both to pass.
  windows-package:
    uses: ./.github/workflows/build-windows.yml
