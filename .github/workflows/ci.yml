name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
          version: "0.11.21"
      - run: uv sync --locked
      - run: uv run ruff check .
      # Portable synthetic/rotation/motion tests always run; local catalogue/reference tests skip without assets.
      - run: uv run pytest -q --junitxml=out/pytest.xml
      - run: uv run python tools/package_test.py
      # Tool definitions are graded by TDQS (https://tdqs.dev); keep the keyless lint free of findings.
      - name: TDQS lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          npx -y mcp-tdqs@0.2.0 lint --command "uv run server.py" --format json --output out/tdqs.json --fail-on warning
          uv run python -c "import json, sys; f = json.load(open('out/tdqs.json'))['findings']; print(*f, sep='\n'); sys.exit(bool(f))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: out/pytest.xml

  windows-package:
    needs: test
    uses: ./.github/workflows/build-windows.yml
