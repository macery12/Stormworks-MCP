[project]
name = "stormworks-hull-mcp"
version = "0.1.0"
description = "Local MCP server for designing, inspecting and editing Stormworks vehicles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "macery12" }]
requires-python = ">=3.10"
keywords = ["stormworks", "mcp", "model-context-protocol", "claude", "procedural-generation", "voxel"]
dependencies = [
    "mcp>=2.2,<3",
    "numpy>=2.0",
    "pillow>=10",
    "tomlkit>=0.13,<1",
    "pydantic>=2.11,<3",
    "typing-extensions>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.22,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "installed: exhaustively check installed Stormworks definitions (skips without game assets)",
    "reference: read-only tests against SW_REFERENCE_VEHICLE (skips when unset)",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "B905", "E501"]
